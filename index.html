<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>MINI GT 1:64 Catalog</title>
  <meta name="description" content="Complete MINI GT 1:64 scale diecast model catalog — browse, filter, and print.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/styles.css?v=1.0.2">
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs" type="module"></script>
</head>
<body>

<!-- ═══════════════════════════ HEADER ═══════════════════════════ -->
<header class="site-header">
  <div class="header-brand">
    <span class="brand-logo">Diecast Catalog</span>
    <span class="brand-scale">1:64</span>
  </div>
  <div class="brand-tabs" id="brandTabs">
    <button class="brand-tab active" data-brand="MINI GT" onclick="changeBrand('MINI GT')">MINI GT</button>
    <button class="brand-tab" data-brand="Hot Wheels" onclick="changeBrand('Hot Wheels')">Hot Wheels</button>
    <button class="brand-tab" data-brand="Pop Race" onclick="changeBrand('Pop Race')">Pop Race</button>
    <button class="brand-tab" data-brand="Tarmac Works" onclick="changeBrand('Tarmac Works')">Tarmac Works</button>
    <button class="brand-tab" data-brand="INNO64" onclick="changeBrand('INNO64')">INNO64</button>
    <button class="brand-tab" data-brand="Trends Hobby" onclick="changeBrand('Trends Hobby')">Trends Hobby</button>
  </div>
  <div class="header-actions">
    <span class="catalog-count" id="catalogCount">Loading…</span>
    <button class="btn-icon" id="btnPrint" onclick="openPrintModal()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      Print Catalog
    </button>
  </div>
</header>

<!-- ══════════════════════════ APP LAYOUT ════════════════════════ -->
<div class="app-container">
  
  <div class="filter-top-bar">
    <button class="btn-filter-toggle" onclick="toggleSidebar()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
      <span class="mobile-hide">Filters</span>
    </button>
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search by name, item number…"
        oninput="handleSearch()"
        autocomplete="off"
        spellcheck="false"
      >
      <button class="clear-btn" id="clearSearch" onclick="clearSearch()" title="Clear search">×</button>
    </div>
    <span class="filter-result-count" id="resultCount"></span>
  </div>

  <div class="app-body">
    <!-- FILTER SIDEBAR -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="filter-sidebar" id="filterSidebar">
      <div class="sidebar-header">
        <h3>Filters</h3>
        <div style="flex:1"></div>
        <button class="btn-reset" onclick="resetFilters()">Reset</button>
        <button class="sidebar-close" onclick="toggleSidebar()">×</button>
      </div>
      <div class="sidebar-scroll" id="dynamicFiltersContainer">
        <!-- JS dynamically populates filters here -->
      </div>
    </aside>

    <!-- MAIN GRID -->
    <main class="catalog-main">
      <div class="product-grid" id="productGrid"></div>
      <div id="loadSentinel"></div>
    </main>
  </div>
</div>

<!-- ═══════════════════════ SELECTION BAR ════════════════════════ -->
<div class="selection-bar" id="selectionBar">
  <span class="sel-count" id="selCount">0 selected</span>
  <div class="sel-sep"></div>
  <button class="btn-sel" onclick="clearSelection()">Clear</button>
  <button class="btn-sel primary" onclick="printSelected()">Print Selected</button>
</div>

<!-- ════════════════════════ PRINT MODAL ═════════════════════════ -->
<div class="modal-overlay" id="printModal" onclick="handleModalClick(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>Export Catalog</h3>
      <button class="modal-close" onclick="closePrintModal()">×</button>
    </div>

    <div class="modal-body">
      <!-- Columns -->
      <div class="form-group">
        <label>Columns per row</label>
        <div class="seg-ctrl" id="colSel">
          <button class="seg-btn" data-val="2" onclick="selCol(this)">2</button>
          <button class="seg-btn" data-val="3" onclick="selCol(this)">3</button>
          <button class="seg-btn active" data-val="4" onclick="selCol(this)">4</button>
          <button class="seg-btn" data-val="5" onclick="selCol(this)">5</button>
          <button class="seg-btn" data-val="6" onclick="selCol(this)">6</button>
        </div>
      </div>

      <!-- Scope -->
      <div class="form-group">
        <label>Print scope</label>
        <div class="seg-ctrl" id="scopeSel">
          <button class="seg-btn active" data-val="all" onclick="selScope(this)">All</button>
          <button class="seg-btn" data-val="filtered" onclick="selScope(this)">Current Filter</button>
          <button class="seg-btn" data-val="selected" onclick="selScope(this)">Selected</button>
        </div>
      </div>

      <!-- Brand sub-filter (shown when scope=all) -->
      <div class="form-group" id="modalBrandWrap">
        <label>Brand (optional)</label>
        <select id="modalBrandSel" class="filter-select" style="max-width:100%;width:100%;" onchange="updatePreviewCount()">
          <option value="">All Brands</option>
        </select>
      </div>
    </div>

    <div class="modal-footer">
      <span class="preview-count" id="previewCount"></span>
      <button class="btn-accent" id="btnExport" onclick="exportCatalog()">Open Print Preview</button>
    </div>
  </div>
</div>

<!-- ════════════════════════ LIGHTBOX MODAL ══════════════════════ -->
<div class="lightbox-overlay" id="lightboxModal" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox(event)">×</button>
  <div class="lightbox-container" onclick="event.stopPropagation()">
    <button class="lightbox-nav btn-prev" id="lightboxPrev" onclick="lightboxSlide(-1, event)">&#8249;</button>
    <div class="lightbox-card">
      <img id="lightboxImg" src="" alt="Zoomed view" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2236%22 height=%2236%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23ccc%22 stroke-width=%221.5%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22/><path d=%22M3 9l4-4 4 4 4-6 4 6%22/><circle cx=%228.5%22 cy=%228.5%22 r=%221.5%22/></svg>'">
    </div>
    <button class="lightbox-nav btn-next" id="lightboxNext" onclick="lightboxSlide(1, event)">&#8250;</button>
  </div>
</div>

<!-- ════════════════════════════ SCRIPT ══════════════════════════ -->
<script>
'use strict';

// ── Data Store ──────────────────────────────────────────────────
let ALL_PRODUCTS = [];      // full dataset
let FILTERED = [];          // after search/brand filter
let SELECTED = new Set();   // selected item_numbers
let renderIndex = 0;        // how many cards rendered so far
const PAGE_SIZE = 60;       // cards per infinite-scroll batch
let CURRENT_BRAND = 'MINI GT';

// ── Per-card carousel state ──────────────────────────────────────
const carouselState = {};   // { itemNumber: { idx: 0, count: N } }

// ── Print modal state ────────────────────────────────────────────
let printCols  = 4;
let printScope = 'all';

// ══════════════════════════════════════════════════════════════════
//  Boot
// ══════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  loadProducts();
  initIntersectionObserver();
});

async function loadProducts() {
  ALL_PRODUCTS = [];
  FILTERED = [];
  SELECTED.clear();
  updateSelectionBar();
  const grid = document.getElementById('productGrid');
  if (grid) grid.innerHTML = '';

  const brandFileMap = {
    'MINI GT': 'products_minigt.json',
    'Hot Wheels': 'products_hotwheels.json',
    'Pop Race': 'products_poprace.json',
    'Tarmac Works': 'products_tarmacworks.json',
    'INNO64': 'products_inno64.json',
    'Trends Hobby': 'products_trendshobby.json'
  };
  const fileName = brandFileMap[CURRENT_BRAND] || 'products_minigt.json';

  try {
    const res = await fetch(`database/${fileName}?v=` + Date.now());
    if (!res.ok) throw new Error(res.statusText);
    ALL_PRODUCTS = await res.json();
    if (!ALL_PRODUCTS || ALL_PRODUCTS.length === 0) {
      showEmpty('No models available yet', 'Our devs are hard at work!', 'assets/no_data.lottie');
      populateFilterFacets();
      return;
    }
  } catch (e) {
    showEmpty('No models available yet', 'Our devs are hard at work!', 'assets/no_data.lottie');
    populateFilterFacets();
    return;
  }

  const searchInput = document.getElementById('searchInput');
  if (searchInput) {
    if (CURRENT_BRAND === 'Hot Wheels') {
      searchInput.placeholder = 'Search by name, toy #…';
    } else if (CURRENT_BRAND === 'Pop Race') {
      searchInput.placeholder = 'Search by name, model #…';
    } else if (CURRENT_BRAND === 'Trends Hobby') {
      searchInput.placeholder = 'Search by name, SKU…';
    } else if (CURRENT_BRAND === 'INNO64') {
      searchInput.placeholder = 'Search by name, SKU…';
    } else if (CURRENT_BRAND === 'Tarmac Works') {
      searchInput.placeholder = 'Search by name, item #…';
    } else {
      searchInput.placeholder = 'Search by name, item #…';
    }
  }

  SELECTED.clear();
  updateSelectionBar();
  populateFilterFacets();
  applyFilters();
}

async function changeBrand(brand) {
  if (CURRENT_BRAND === brand && ALL_PRODUCTS.length > 0) return;
  CURRENT_BRAND = brand;
  
  document.querySelectorAll('.brand-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.brand === brand);
  });
  
  await loadProducts();
}

// ── DYNAMIC FILTERING ─────────────────────────────────────────────
let ACTIVE_FILTER_KEYS = [];

function toggleSidebar() {
  document.getElementById('filterSidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearch').style.display = 'none';
  
  ACTIVE_FILTER_KEYS.forEach(key => {
    const el = document.getElementById(`filter-${key}`);
    if (el) el.value = '';
  });
  
  applyFilters();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearSearch').style.display = 'none';
  applyFilters();
}

function handleSearch() {
  const q = document.getElementById('searchInput').value;
  document.getElementById('clearSearch').style.display = q ? 'block' : 'none';
  applyFilters();
}

function tokenMatch(query, fields) {
  if (!query) return true;
  const tokens = query.toLowerCase().trim().split(/\s+/).filter(Boolean);
  const haystack = fields.join(' ').toLowerCase();
  return tokens.every(t => haystack.includes(t));
}

const DEPENDENT_FILTERS = {
  'sub_series': 'series',
  'sub_collection': 'collection',
  'sub_category': 'category'
};

function updateDependentFiltersConfig() {
  delete DEPENDENT_FILTERS['brand'];
  if (CURRENT_BRAND === 'Pop Race') {
    DEPENDENT_FILTERS['brand'] = 'make';
  }
}

function handleFilterChange(changedKey) {
  for (const [childKey, parentKey] of Object.entries(DEPENDENT_FILTERS)) {
    if (parentKey === changedKey) {
      const childSelect = document.getElementById(`filter-${childKey}`);
      if (childSelect && childSelect.value !== "") {
        childSelect.value = "";
        handleFilterChange(childKey);
      }
    }
  }
  applyFilters();
}

function populateFilterFacets() {
  updateDependentFiltersConfig();
  const container = document.getElementById('dynamicFiltersContainer');
  container.innerHTML = '';
  ACTIVE_FILTER_KEYS = [];

  if (!ALL_PRODUCTS || ALL_PRODUCTS.length === 0) return;

  // 1. Discover all unique keys across the dataset
  const excludeKeys = new Set([
    'item_number', 'product_name', 'images', 'source', 'toy_brand', 'is_cancelled', 'release_year_confidence',
    // Redundant with 'brand':
    'manufacturer', 'set_manufacturers',
    // Redundant with 'release_year':
    'year',
    // Noisy auto-generated filters (useful as card metadata, not as dropdown filters):
    'series_line', 'series_group', 'finish', 'color', 'vehicle_model',
    'model_type', 'vehicle_type', 'description', 'collection', 'region',
    'tags', 'product_type'
  ]);

  if (CURRENT_BRAND === 'Hot Wheels') {
    excludeKeys.add('brand');
  }
  if (CURRENT_BRAND === 'Pop Race' || CURRENT_BRAND === 'MINI GT') {
    excludeKeys.add('status');
  }

  // Human-friendly labels for filter keys
  const filterLabels = {
    'make': 'Make',
    'release_year': 'Year',
    'brand': 'Car brand',
    'series': 'Categories',
    'sub_series': 'Sub-Series',
    'scale': 'Scale',
  };

  const keyValues = {};

  ALL_PRODUCTS.forEach(p => {
    Object.keys(p).forEach(key => {
      if (excludeKeys.has(key)) return;
      const val = p[key];
      if (val === null || val === undefined || val === '') return;
      
      if (!keyValues[key]) keyValues[key] = new Set();
      
      if (Array.isArray(val)) {
        val.forEach(v => { if(v) keyValues[key].add(v.toString()); });
      } else {
        keyValues[key].add(val.toString());
      }
    });
  });

  // 2. Build select dropdowns for keys that have > 1 unique value
  // We sort keys to put important ones first
  const priority = ['make', 'brand', 'series', 'sub_series', 'release_year', 'scale', 'status'];
  const sortedKeys = Object.keys(keyValues).sort((a, b) => {
    let ia = priority.indexOf(a);
    let ib = priority.indexOf(b);
    if (ia === -1) ia = 999;
    if (ib === -1) ib = 999;
    if (ia !== ib) return ia - ib;
    return a.localeCompare(b);
  });

  sortedKeys.forEach(key => {
    const vals = Array.from(keyValues[key]).sort();
    if (vals.length < 2 && key !== 'brand' && key !== 'make') return; // Skip trivial filters

    ACTIVE_FILTER_KEYS.push(key);

    const group = document.createElement('div');
    group.className = 'filter-group';
    
    const label = document.createElement('label');
    label.textContent = filterLabels[key] || key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    
    const select = document.createElement('select');
    select.id = `filter-${key}`;
    select.className = 'filter-select-full';
    select.onchange = () => handleFilterChange(key);
    
    const isDependent = Object.keys(DEPENDENT_FILTERS).includes(key);
    
    if (!isDependent) {
      select.innerHTML = `<option value="">All ${label.textContent}</option>`;
      vals.forEach(v => {
        if (v === 'Regular') return; // Skip 'Regular' default as a filterable explicit choice usually
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        select.appendChild(opt);
      });
    } else {
      select.disabled = true;
      const parentLabel = DEPENDENT_FILTERS[key].replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      select.innerHTML = `<option value="">Select ${parentLabel} First</option>`;
    }

    group.appendChild(label);
    group.appendChild(select);
    container.appendChild(group);
  });

  // Populate Print Modal Brand filter
  const manufacturers = [...new Set(ALL_PRODUCTS.map(p => p.manufacturer).filter(Boolean))].sort();
  const mSelect = document.getElementById('modalBrandSel');
  if (mSelect) {
    mSelect.innerHTML = '<option value="">All Manufacturers</option>';
    manufacturers.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      mSelect.appendChild(opt);
    });
  }
}

function applyFilters() {
  const query = document.getElementById('searchInput').value.trim();
  
  // Collect active filter values
  const activeFilters = {};
  ACTIVE_FILTER_KEYS.forEach(key => {
    const val = document.getElementById(`filter-${key}`).value;
    if (val) activeFilters[key] = val;
  });

  FILTERED = ALL_PRODUCTS.filter(p => {
    const matchSearch = tokenMatch(query, [p.product_name || '', p.item_number || '']);
    if (!matchSearch) return false;

    // Must match all active dropdowns
    for (const [key, expectedVal] of Object.entries(activeFilters)) {
      const pVal = p[key];
      if (Array.isArray(pVal)) {
        if (!pVal.map(x=>x.toString()).includes(expectedVal)) return false;
      } else {
        if (pVal == null || pVal.toString() !== expectedVal) return false;
      }
    }
    
    return true;
  });

  // Handle cascading dependent filters
  for (const [childKey, parentKey] of Object.entries(DEPENDENT_FILTERS)) {
    if (!ACTIVE_FILTER_KEYS.includes(childKey)) continue;
    const childSelect = document.getElementById(`filter-${childKey}`);
    if (!childSelect) continue;
    
    const parentVal = activeFilters[parentKey];
    if (!parentVal) {
      childSelect.disabled = true;
      const parentLabel = parentKey.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      childSelect.innerHTML = `<option value="">Select ${parentLabel} First</option>`;
      childSelect.value = '';
      if (activeFilters[childKey]) {
        delete activeFilters[childKey];
      }
    } else {
      const currentVal = childSelect.value;
      childSelect.disabled = false;
      
      const validChildren = new Set();
      ALL_PRODUCTS.forEach(p => {
        const pParentVal = Array.isArray(p[parentKey]) ? p[parentKey] : [p[parentKey]];
        if (pParentVal.map(x=>x?.toString()).includes(parentVal)) {
          const pChildVal = p[childKey];
          if (Array.isArray(pChildVal)) {
            pChildVal.forEach(x => { if(x && x !== 'Regular') validChildren.add(x.toString()); });
          } else if (pChildVal && pChildVal !== 'Regular') {
            validChildren.add(pChildVal.toString());
          }
        }
      });
      
      const sortedChildren = Array.from(validChildren).sort();
      const label = childKey.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      childSelect.innerHTML = `<option value="">All ${label}</option>`;
      
      sortedChildren.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        childSelect.appendChild(opt);
      });
      
      if (sortedChildren.includes(currentVal)) {
        childSelect.value = currentVal;
      } else {
        childSelect.value = '';
        if (currentVal && activeFilters[childKey]) {
          delete activeFilters[childKey];
        }
      }
    }
  }

  // Refilter in case a dependent child was cleared because its parent changed
  FILTERED = ALL_PRODUCTS.filter(p => {
    const matchSearch = tokenMatch(query, [p.product_name || '', p.item_number || '']);
    if (!matchSearch) return false;
    for (const [key, expectedVal] of Object.entries(activeFilters)) {
      const pVal = p[key];
      if (Array.isArray(pVal)) {
        if (!pVal.map(x=>x?.toString()).includes(expectedVal)) return false;
      } else {
        if (pVal == null || pVal.toString() !== expectedVal) return false;
      }
    }
    return true;
  });

  // Update counts
  const total = ALL_PRODUCTS.length;
  const shown = FILTERED.length;
  document.getElementById('catalogCount').textContent =
    shown === total ? `${total.toLocaleString()} models` : `${shown.toLocaleString()} / ${total.toLocaleString()} models`;
  
  document.getElementById('resultCount').textContent = `${shown.toLocaleString()} result${shown !== 1 ? 's' : ''}`;

  renderIndex = 0;
  document.getElementById('productGrid').innerHTML = '';
  renderBatch();
  updatePreviewCount();
}

// ══════════════════════════════════════════════════════════════════
//  Rendering — Virtual Infinite Scroll
// ══════════════════════════════════════════════════════════════════
function renderBatch() {
  if (renderIndex >= FILTERED.length) {
    if (FILTERED.length === 0) showEmpty('No results', 'Try a different search or reset the filters.');
    return;
  }

  const grid = document.getElementById('productGrid');
  const slice = FILTERED.slice(renderIndex, renderIndex + PAGE_SIZE);

  slice.forEach(p => {
    const card = buildCard(p);
    grid.appendChild(card);
  });

  renderIndex += slice.length;
}

function buildCard(p) {
  const num    = p.item_number || '';
  const name   = p.product_name || 'Unknown Model';
  const imgs   = Array.isArray(p.images) ? p.images : [];
  const hasMulti = imgs.length > 1;

  // Init carousel state
  carouselState[num] = { idx: 0, count: imgs.length };

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.item = num;

  // Build slides HTML
  let slidesHTML = imgs.length
    ? imgs.map(url =>
        `<div class="cr-slide"><img src="${escHtml(url)}" alt="${escHtml(name)}" loading="lazy" onerror="this.style.visibility='hidden'"></div>`
      ).join('')
    : `<div class="cr-slide" style="display:flex;align-items:center;justify-content:center;height:100%;background:#f5f5f5;">
         <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9l4-4 4 4 4-6 4 6"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>
       </div>`;

  let dotsHTML = '';
  if (hasMulti) {
    dotsHTML = '<div class="cr-dots">' +
      imgs.map((_, i) => `<span class="cr-dot${i === 0 ? ' active' : ''}" onclick="crJump('${escHtml(num)}',${i},event)"></span>`).join('') +
      '</div>';
  }

  const arrowsHTML = hasMulti
    ? `<button class="cr-btn cr-prev" onclick="crSlide('${escHtml(num)}',-1,event)">&#8249;</button>
       <button class="cr-btn cr-next" onclick="crSlide('${escHtml(num)}',1,event)">&#8250;</button>`
    : '';

  let labelPrefix = 'Item #: ';
  if (CURRENT_BRAND === 'Hot Wheels') {
    labelPrefix = 'Toy #: ';
  } else if (CURRENT_BRAND === 'Pop Race') {
    labelPrefix = 'Model #: ';
  } else if (CURRENT_BRAND === 'INNO64' || CURRENT_BRAND === 'Trends Hobby' || CURRENT_BRAND === 'Tarmac Works') {
    labelPrefix = 'SKU: ';
  }

  let badgeHTML = '';
  if (p.release_year) {
    badgeHTML += `<span class="card-year-chip">${escHtml(p.release_year)}</span>`;
  }
  if (p.series && p.series !== 'Regular') {
    badgeHTML += `<span class="card-badge line-badge">${escHtml(p.series)}</span>`;
  }
  if (p.sub_series && p.sub_series !== 'Regular') {
    badgeHTML += `<span class="card-badge sub-badge">${escHtml(p.sub_series)}</span>`;
  }
  if (p.status === 'Pre-Order') {
    badgeHTML += `<span class="card-badge pre-order">Pre-Order</span>`;
  }
  const badgesHTML = `<div class="card-badges-container">${badgeHTML}</div>`;

  card.innerHTML = `
    <div class="card-media">
      <div class="cr-track-wrap" onclick="openLightbox('${escHtml(num)}', event)" style="cursor: zoom-in;">
        <div class="cr-track" id="crt-${escHtml(num)}">${slidesHTML}</div>
      </div>
      ${arrowsHTML}
      ${dotsHTML}
      ${badgesHTML}
      <label class="card-chk" title="Select for printing">
        <input type="checkbox" id="chk-${escHtml(num)}"
          ${SELECTED.has(num) ? 'checked' : ''}
          onchange="toggleSelect('${escHtml(num)}', this)"
          onclick="event.stopPropagation()">
      </label>
    </div>
    <div class="card-info">
      <div class="card-num"><span class="card-num-prefix">${labelPrefix}</span>${escHtml(num)}</div>
      <div class="card-name">${escHtml(name)}</div>
    </div>
  `;

  return card;
}

function showEmpty(title, body, lottiePath = null) {
  const grid = document.getElementById('productGrid');
  if (!grid) return;
  
  let mediaHtml = `
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 1rem;">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  `;
  
  if (lottiePath) {
    if (lottiePath.endsWith('.lottie')) {
      mediaHtml = `
        <dotlottie-player 
          src="${lottiePath}" 
          background="transparent" 
          speed="1" 
          style="width: 200px; height: 200px; margin: 0 auto 1.5rem;" 
          loop 
          autoplay>
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 76px auto; animation: spin 2s linear infinite;">
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
            <circle cx="12" cy="12" r="10" stroke-dasharray="30" stroke-dashoffset="10"/>
          </svg>
        </dotlottie-player>
      `;
    } else {
      mediaHtml = `
        <lottie-player 
          src="${lottiePath}" 
          background="transparent" 
          speed="1" 
          style="width: 200px; height: 200px; margin: 0 auto 1.5rem;" 
          loop 
          autoplay>
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 76px auto; animation: spin 2s linear infinite;">
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
            <circle cx="12" cy="12" r="10" stroke-dasharray="30" stroke-dashoffset="10"/>
          </svg>
        </lottie-player>

    <div class="state-empty" style="text-align: center; padding: 4rem 2rem; color: var(--text-muted);">

      <p style="margin: 0; font-size: 0.95rem; line-height: 1.5;">${escHtml(body)}</p>
    </div>`;
}

function initIntersectionObserver() {
  const sentinel = document.getElementById('loadSentinel');
  const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) renderBatch();
  }, { rootMargin: '400px' });
  observer.observe(sentinel);
}

// ══════════════════════════════════════════════════════════════════
//  Carousel
// ══════════════════════════════════════════════════════════════════
function crSlide(num, dir, event) {
  event && event.stopPropagation();
  const state = carouselState[num];
  if (!state || state.count < 2) return;
  state.idx = (state.idx + dir + state.count) % state.count;
  _crApply(num);
}

function crJump(num, idx, event) {
  event && event.stopPropagation();
  const state = carouselState[num];
  if (!state) return;
  state.idx = idx;
  _crApply(num);
}

function _crApply(num) {
  const state = carouselState[num];
  const track = document.getElementById('crt-' + num);
  if (track) track.style.transform = `translateX(-${state.idx * 100}%)`;

  // Update dots
  const card = document.querySelector(`.card[data-item="${CSS.escape(num)}"]`);
  if (!card) return;
  card.querySelectorAll('.cr-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === state.idx);
  });
}

// ══════════════════════════════════════════════════════════════════
//  Selection
// ══════════════════════════════════════════════════════════════════
function toggleSelect(num, checkbox) {
  if (checkbox.checked) {
    SELECTED.add(num);
  } else {
    SELECTED.delete(num);
  }
  updateSelectionBar();
}

function clearSelection() {
  SELECTED.clear();
  document.querySelectorAll('.card-chk input[type="checkbox"]').forEach(cb => cb.checked = false);
  updateSelectionBar();
}

function updateSelectionBar() {
  const bar = document.getElementById('selectionBar');
  const n = SELECTED.size;
  document.getElementById('selCount').textContent = `${n} selected`;
  bar.classList.toggle('visible', n > 0);
  updatePreviewCount();
}

// ══════════════════════════════════════════════════════════════════
//  Print Modal
// ══════════════════════════════════════════════════════════════════
function openPrintModal() {
  document.getElementById('printModal').classList.add('open');
  updatePreviewCount();
}

function closePrintModal() {
  document.getElementById('printModal').classList.remove('open');
}

function handleModalClick(event) {
  if (event.target === event.currentTarget) closePrintModal();
}

function selCol(btn) {
  document.querySelectorAll('#colSel .seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  printCols = parseInt(btn.dataset.val);
}

function selScope(btn) {
  document.querySelectorAll('#scopeSel .seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  printScope = btn.dataset.val;

  // Show brand filter only when scope = "all"
  const brandWrap = document.getElementById('modalBrandWrap');
  brandWrap.style.display = printScope === 'all' ? 'block' : 'none';

  updatePreviewCount();
}

function updatePreviewCount() {
  const ps = _getPrintSet();
  document.getElementById('previewCount').textContent =
    `${ps.length.toLocaleString()} model${ps.length !== 1 ? 's' : ''}`;
}

function _getPrintSet() {
  if (printScope === 'selected') {
    return ALL_PRODUCTS.filter(p => SELECTED.has(p.item_number));
  }
  if (printScope === 'filtered') {
    return FILTERED;
  }
  // All — optionally filtered by modal manufacturer selection
  const mBrand = document.getElementById('modalBrandSel').value;
  return mBrand
    ? ALL_PRODUCTS.filter(p => p.manufacturer === mBrand)
    : ALL_PRODUCTS;
}

function printSelected() {
  printScope = 'selected';
  // Update modal UI to reflect "selected" scope
  document.querySelectorAll('#scopeSel .seg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.val === 'selected');
  });
  document.getElementById('modalBrandWrap').style.display = 'none';
  exportCatalog();
}

function exportCatalog() {
  const products = _getPrintSet();
  if (!products.length) {
    alert('No models match the current print scope.');
    return;
  }
  closePrintModal();

  // Build print page URL with data encoded as a compact param
  const params = new URLSearchParams({
    cols: printCols,
    data: JSON.stringify(products.map(p => ({
      n: p.item_number,
      t: p.product_name,
      b: p.brand,
      i: Array.isArray(p.images) && p.images.length ? p.images[0] : ''
    })))
  });

  // Open print preview in new tab
  const printUrl = `catalog_print.html?${params.toString()}`;
  window.open(printUrl, '_blank');
}

// ══════════════════════════════════════════════════════════════════
//  Utilities
// ══════════════════════════════════════════════════════════════════
const _escDiv = document.createElement('div');
function escHtml(str) {
  _escDiv.textContent = str;
  return _escDiv.innerHTML;
}

// ── Lightbox JS Logic ───────────────────────────────────────────
let lightboxImages = [];
let lightboxIndex = 0;

function openLightbox(num, event) {
  event && event.stopPropagation();
  const p = ALL_PRODUCTS.find(x => x.item_number === num);
  if (!p) return;

  lightboxImages = Array.isArray(p.images) ? p.images : [];
  if (!lightboxImages.length) return;

  // Sync index with the card's active carousel slide
  const state = carouselState[num];
  lightboxIndex = state ? Math.min(state.idx, lightboxImages.length - 1) : 0;

  _updateLightbox();
  document.getElementById('lightboxModal').classList.add('open');
}

function closeLightbox(event) {
  if (event && event.target !== event.currentTarget && !event.target.classList.contains('lightbox-close')) return;
  document.getElementById('lightboxModal').classList.remove('open');
}

function lightboxSlide(dir, event) {
  event && event.stopPropagation();
  if (!lightboxImages.length) return;
  lightboxIndex = (lightboxIndex + dir + lightboxImages.length) % lightboxImages.length;
  _updateLightbox();
}

function _updateLightbox() {
  const img = document.getElementById('lightboxImg');
  const prevBtn = document.getElementById('lightboxPrev');
  const nextBtn = document.getElementById('lightboxNext');

  img.src = lightboxImages[lightboxIndex];
  
  const showNav = lightboxImages.length > 1;
  prevBtn.style.display = showNav ? 'flex' : 'none';
  nextBtn.style.display = showNav ? 'flex' : 'none';
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  const isLightboxOpen = document.getElementById('lightboxModal').classList.contains('open');
  
  if (isLightboxOpen) {
    if (e.key === 'Escape') {
      e.preventDefault();
      closeLightbox();
    }
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      lightboxSlide(-1);
    }
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      lightboxSlide(1);
    }
    return;
  }

  if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
    e.preventDefault();
    openPrintModal();
  }
  if (e.key === 'Escape') closePrintModal();
  // Focus search with /
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});
</script>

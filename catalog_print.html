<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>MINI GT Print Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8f8f8;
    }

    /* ── Controls bar (hidden on print) ── */
    .ctrl-bar {
      position: sticky;
      top: 0;
      background: #111827;
      color: #e2e8f0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      font-size: 13px;
    }
    .ctrl-bar strong { font-weight: 600; color: #fff; }
    .ctrl-bar span   { color: #94a3b8; font-size: 12px; }
    .ctrl-spacer     { flex: 1; }
    .btn-print-now {
      background: #4f7eff;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-print-now:hover { background: #6b8fff; }

    /* ── Print Grid ── */
    .print-grid {
      display: grid;
      gap: 4px;
      padding: 8px;
    }

    .print-card {
      background: #fff;
      overflow: hidden;
      border-radius: 4px;
    }
    .print-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }
    .print-card-info {
      padding: 4px 5px 5px;
      border-top: 1px solid #f0f0f0;
    }
    .print-num {
      font-size: 9px;
      font-weight: 600;
      color: #4f7eff;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }
    .print-name {
      font-size: 9.5px;
      color: #374151;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* No-image placeholder */
    .no-img {
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
    }
    .no-img svg { opacity: 0.3; }

    /* ── Print styles ── */
    @media print {
      .ctrl-bar { display: none !important; }
      body { background: #fff; }
      .print-grid { padding: 0; gap: 2px; }
      .print-card { break-inside: avoid; }
      @page { margin: 8mm; }
    }
  </style>
</head>
<body>

<div class="ctrl-bar" id="ctrlBar">
  <strong>MINI GT Print Preview</strong>
  <span id="modelCountLabel">Loading…</span>
  <div class="ctrl-spacer"></div>
  <button class="btn-print-now" onclick="window.print()">🖨 Print / Save PDF</button>
</div>

<div class="print-grid" id="printGrid"></div>

<script>
(function() {
  // Parse query params
  const params = new URLSearchParams(window.location.search);
  const cols = parseInt(params.get('cols') || '4', 10);
  const rawData = params.get('data');

  const grid = document.getElementById('printGrid');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  let products = [];
  if (rawData) {
    try { products = JSON.parse(rawData); } catch(e) { }
  }

  document.getElementById('modelCountLabel').textContent =
    `${products.length.toLocaleString()} model${products.length !== 1 ? 's' : ''} · ${cols} columns`;

  if (!products.length) {
    grid.innerHTML = '<p style="padding:40px;color:#999;text-align:center;">No products to display.</p>';
    return;
  }

  const frag = document.createDocumentFragment();
  products.forEach(p => {
    const card = document.createElement('div');
    card.className = 'print-card';

    if (p.i) {
      const imgDiv = document.createElement('div');
      const img = document.createElement('img');
      img.src = p.i;
      img.alt = p.t || '';
      img.loading = 'lazy';
      imgDiv.appendChild(img);
      card.appendChild(imgDiv);
    } else {
      const noImg = document.createElement('div');
      noImg.className = 'no-img';
      noImg.innerHTML = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9l4-4 4 4 4-6 4 6"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
      </svg>`;
      card.appendChild(noImg);
    }

    const info = document.createElement('div');
    info.className = 'print-card-info';
    info.innerHTML = `
      <div class="print-num">${(p.n||'').replace(/</g,'&lt;')}</div>
      <div class="print-name">${(p.t||'').replace(/</g,'&lt;')}</div>
    `;
    card.appendChild(info);
    frag.appendChild(card);
  });

  grid.appendChild(frag);
})();
</script>
</body>
</html>
